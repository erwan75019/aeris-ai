name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AERIS_DATABASE_URL: postgresql+asyncpg://aeris:aeris@localhost:5432/aeris
    services:
      postgres:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_DB: aeris
          POSTGRES_USER: aeris
          POSTGRES_PASSWORD: aeris
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeris -d aeris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,database,ml,dl]'
      - run: ruff format --check backend
      - run: ruff check backend
      - run: mypy backend
      - run: alembic upgrade head
      - run: python -m backend.scripts.seed_demo
      - run: pytest --cov=backend --cov-report=term-missing --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          AERIS_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, browser]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/backend.Dockerfile .
      - run: docker build -f docker/frontend.Dockerfile .
